[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team"
version = "0.1.0"
description = "A configurable team of AI agents (any model, any machine) that plans, builds, reviews, markets and ships a software project through GitHub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
screenshots = ["pillow>=10"]
dev = ["pillow>=10"]

[project.scripts]
agent-team = "agent_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_team = ["prompts/*.md"]
