[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team"
version = "0.13.13"
description = "agent-team, the engine of Lakeba OS: an AI dev team for your repository."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lakeba" }]
keywords = ["ai", "agents", "llm", "claude", "ollama", "github", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
screenshots = ["pillow>=10"]
dev = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/lakeba/agent-team"
Documentation = "https://lakeba.github.io/agent-team/"
Changelog = "https://github.com/lakeba/agent-team/blob/main/CHANGELOG.md"

[project.scripts]
agent-team = "agent_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_team = ["prompts/*.md", "dashboard/static/*", "demo/*.json", "demo/tipsplit/*.md", "demo/tipsplit/*.toml",
              "demo/tipsplit/src/tipsplit/*.py", "demo/tipsplit/tests/*.py", "builtin/agents/*.md",
              "builtin/playbooks/*.md", "builtin/rules/*/*.md", "builtin/skills/*/SKILL.md"]
