# A larger team spread across machines. Every provider below can live on a different host.

[project]
name = "web-app"
repo = "acme/web-app"
test_command = "npm test"
test_count_pattern = 'Tests:\s+(?:\d+ \w+, )*(\d+) total'
guarantees = ["No secrets in the repository", "Every API change has a test"]
context_skip = ["node_modules/", ".next/", "public/"]
context = "auto"                   # focused context once the project is too big to send whole

[limits]
per_run = 5.0                      # US dollars
per_day = 25.0

[providers.claude]
kind = "anthropic"

[providers.studio]                 # a Mac Studio on the LAN running Ollama
kind = "ollama"
url = "http://studio.local:11434"

[providers.vllm]                   # a Linux GPU server with an OpenAI-compatible endpoint
kind = "openai"
url = "http://gpu-01.internal:8000"
api_key_env = "VLLM_API_KEY"

[providers.lisa-laptop]            # a teammate's machine running `agent-team serve`
kind = "agent-http"
url = "http://10.0.0.42:8765"
api_key_env = "LISA_NODE_TOKEN"

[[agents]]
name = "Atlas"
role = "lead"
provider = "claude"
model = "claude-opus-5-5"
owns = ["ROADMAP.md", "docs/architecture.md"]

[[agents]]
name = "Forge"
role = "builder"
provider = "studio"
model = "qwen3.8:27b-mlx"

[[agents]]
name = "Anvil"                     # a second builder: `build --parallel` splits work across both
role = "builder"
provider = "vllm"
model = "qwen3.8-flash-next"

[[agents]]
name = "Sentinel"
role = "security"                  # reviews every approved build; signs off every PR
provider = "lisa-laptop"
description = "Security reviewer: authentication, secrets, input validation."
owns = ["*"]

[[agents]]
name = "Probe"
role = "qa"                        # writes the tests for each plan before the builders start
provider = "claude"
model = "claude-sonnet-5-5"
owns = ["tests/", "src/__tests__/"]

[[agents]]
name = "Quill"
role = "docs"                      # updates the docs after each approved build
provider = "claude"
model = "claude-haiku-5-5"
owns = ["README.md", "docs/", "CHANGELOG.md"]

[[agents]]
name = "Spark"
role = "marketing"
provider = "claude"
model = "claude-sonnet-5-5"
owns = ["BRIEF.md", "site/", "deck/"]

[[agents]]
name = "Harbor"
role = "devops"
provider = "claude"
model = "claude-sonnet-5-5"
effort = "medium"
