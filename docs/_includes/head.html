<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · agent-team{% else %}agent-team: your AI dev team, on any model{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}agent-team">

<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16z' fill='%232a6fd6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
