<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · agent-team{% else %}agent-team: your AI dev team, on any model{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}agent-team">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/assets/brand/social-card.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="agent-team by Lakeba">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/brand/lakeba-mark.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/brand/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#0b1d37">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script>try{var t=localStorage.getItem("at-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
