<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-team</title>
  <link rel="icon" href="/lakeba-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <a class="logo" href="https://lakeba.com" target="_blank" rel="noopener noreferrer" title="agent-team by Lakeba"><img src="/lakeba-mark.svg" alt="Lakeba" width="30" height="30"></a>
      <div>
        <h1 id="project-name">agent-team</h1>
        <p class="sub"><a id="repo-link" href="#" target="_blank" rel="noopener noreferrer"></a><span id="version"></span></p>
      </div>
    </div>
    <div class="top-actions">
      <span class="badge neutral" title="Runs on this Mac only; edits change .team.toml after you review them">Local</span>
      <span id="refreshed" class="muted small"></span>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div id="stale" class="stale" role="status" hidden></div>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" data-tab="team" aria-selected="false">Team</button>
    <button role="tab" data-tab="runs" aria-selected="false">Runs</button>
    <button role="tab" data-tab="costs" aria-selected="false">Costs</button>
    <button role="tab" data-tab="activity" aria-selected="false">Activity</button>
    <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    <button role="tab" data-tab="projects" aria-selected="false">Projects</button>
  </nav>

  <main>
    <section id="overview" class="panel" role="tabpanel"></section>
    <section id="team" class="panel" role="tabpanel" hidden></section>
    <section id="runs" class="panel" role="tabpanel" hidden></section>
    <section id="costs" class="panel" role="tabpanel" hidden></section>
    <section id="activity" class="panel" role="tabpanel" hidden></section>
    <section id="settings" class="panel" role="tabpanel" hidden></section>
    <section id="projects" class="panel" role="tabpanel" hidden></section>
  </main>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <footer class="made"><a href="https://lakeba.com" target="_blank" rel="noopener noreferrer"><img src="/lakeba-mark.svg" alt="" width="14" height="14"> agent-team by Lakeba</a></footer>
  <script src="/app.js"></script>
  <script src="/edit.js"></script>
  <script src="/runs.js"></script>
  <script src="/settings.js"></script>
  <script src="/activity.js"></script>
  <script src="/projects.js"></script>
</body>
</html>
