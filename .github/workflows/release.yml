# Release agent-team: push a tag vX.Y.Z on main. This checks the tag matches every copy of the
# version, runs the tests, builds the package, publishes it to PyPI (trusted publishing: no
# token stored here) and creates the GitHub release with that version's CHANGELOG notes.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but version $version"; exit 1; }
      - name: Tests
        run: |
          python -m pip install -q -e .
          cd tests && python -m unittest -q
      - name: Build
        run: |
          python -m pip install -q build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: PyPI trusts this workflow, no secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'PY' > notes.md
          import re, os
          text = open("CHANGELOG.md", encoding="utf-8").read()
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else f"agent-team {version}")
          PY
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "agent-team $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
